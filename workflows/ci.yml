name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.detect.outputs.has == 'true'
      - run: npm run typecheck
        if: steps.detect.outputs.has == 'true'
      - run: npm test
        if: steps.detect.outputs.has == 'true'
      - name: Secret scan (simple)
        run: |
          if grep -rIE "re_[A-Za-z0-9]{20,}|RESEND_API_KEY=.+" --exclude-dir=node_modules --exclude-dir=.git --exclude=.dev.vars.example . ; then echo "Possible secret found"; exit 1; fi
