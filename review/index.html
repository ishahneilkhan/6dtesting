<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shah Neil Khan — 3D Design Review</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#0c0c0e"><meta name="description" content="ক্লায়েন্টের প্রজেক্ট রিভিউ।"><meta property="og:title" content="Shah Neil Khan — 3D Design Review"><meta property="og:description" content="ক্লায়েন্টের প্রজেক্ট রিভিউ।"><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><meta name="robots" content="noindex"></head>
<body><a href="../index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;z-index:50;background:rgba(22,21,26,.88);border:1px solid #4a3f27;color:#d4af37;padding:6px 12px;border-radius:999px;font:.8rem system-ui,sans-serif;text-decoration:none">← হোম</a><main><div id="app"></div></main>
<script src="data.js"></script><script src="common.js"></script>
<script>
const app=document.getElementById('app'),P=window.PROJECTS||[];
function render(){const c=location.hash.slice(1).toUpperCase();const p=c&&P.find(x=>x.code===c);p?renderProject(app,p):home()}
function home(){
  app.innerHTML=`<div class="center box"><div class="mono">3D Design Review</div><h1>Shah Neil Khan</h1><p class="mono" style="margin:0 0 16px">3D Designer · Interior</p>
  <label class="mono" for="cd">প্রজেক্ট কোড</label><input id="cd" autocomplete="off" placeholder="যেমন A7K2"><p class="err" id="er"></p><button class="pri" id="go">খুলুন</button></div>`;
  const go=()=>{const v=document.getElementById('cd').value.trim().toUpperCase();if(P.find(x=>x.code===v)){history.replaceState(null,'','#'+v);render()}else document.getElementById('er').textContent='কোড মেলেনি'};
  document.getElementById('go').onclick=go;document.getElementById('cd').onkeydown=e=>{if(e.key==='Enter')go()};
}
addEventListener('hashchange',render);render();
</script><script src="../lang.js"></script></body></html>
