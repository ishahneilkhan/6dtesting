<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio — SNK Architect</title><meta name="description" content="Architecture and interior visualization concepts with an interactive 3D studio."><meta name="theme-color" content="#111820"><link rel="stylesheet" href="css/style.css"></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="wrap"><a class="brand" href="index.html">SNK <b>ARCHITECT</b></a><nav aria-label="Main"><ul><li><a href="index.html#studio">3D Studio</a></li><li><a href="planner.html">Plan Studio</a></li><li><a href="services.html">Services</a></li><li><a href="portfolio.html" aria-current="page">Portfolio</a></li><li><a href="contact.html">Contact</a></li></ul></nav></div></header>
<main id="main">
<section class="sec"><div class="wrap"><p class="eyebrow">Portfolio</p><h1>Projects &amp; visualizations</h1>
<div id="filters" class="cta" hidden></div><div id="list" class="cards"></div></div></section>
<script type="module">
import {SITE} from './js/site.js';
const list=document.getElementById('list'),fl=document.getElementById('filters');
function show(cat){list.textContent='';SITE.projects.filter(p=>!cat||p.category===cat).forEach(p=>{const c=document.createElement('article');c.className='card';
 if(p.image){const i=document.createElement('img');i.src=p.image;i.alt=p.title+' ('+p.category+')';i.style.cssText='width:100%;border-radius:12px;margin-bottom:10px';c.appendChild(i)}
 const h=document.createElement('h3');h.textContent=p.title;const d=document.createElement('p');d.className='muted';d.textContent=p.description||'';c.append(h,d);
 if(p.materials){const m=document.createElement('p');m.className='muted';m.textContent='Materials: '+p.materials;c.appendChild(m)}
 if(p.concept){const t=document.createElement('p');t.className='muted';t.textContent='Concept visualization, not a completed project.';c.appendChild(t)}
 list.appendChild(c)})}
if(!SITE.projects.length){list.className='';const e=document.createElement('div');e.className='empty';
 e.textContent='No projects are published yet. Verified projects added to js/site.js will appear here with category filters (living room, bedroom, kitchen, bathroom, house exterior).';list.appendChild(e)}
else{const cats=[...new Set(SITE.projects.map(p=>p.category))];fl.hidden=false;
 ['All',...cats].forEach(c=>{const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent=c;b.onclick=()=>show(c==='All'?'':c);fl.appendChild(b)});show('')}
</script>
</main>
<footer><div class="wrap"><strong>SNK Architect</strong> · Design Beyond Imagination.<br>Design • Build • Visualize<br>Concept visualizations only — not construction drawings, structural or engineering advice.</div></footer>
</body></html>
