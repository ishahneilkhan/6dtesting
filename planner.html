<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Studio — SNK Architect</title><meta name="theme-color" content="#111820">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#f1f4f7;--p:#fff;--ink:#111820;--mute:#5d6b78;--ln:#d9e0e6;--gold:#D7B77B;--navy:#111820}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--navy);color:#f7f5f0}
.brand{font-weight:800;letter-spacing:.14em;color:#f7f5f0;text-decoration:none;margin-right:auto}.brand b{color:var(--gold)}
.tg{display:flex;border:1px solid #3a4756;border-radius:10px;overflow:hidden}
.tg button{background:transparent;color:#f7f5f0;border:0;padding:7px 16px;font:inherit;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--gold);color:var(--navy);font-weight:700}
button{font:inherit;cursor:pointer}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:8px 16px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
aside{background:var(--p);border-right:1px solid var(--ln);overflow:auto;padding:14px}
aside h2{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}aside h2:first-child{margin-top:0}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--mute)}
input[type=number]{width:110px;padding:7px;border:1px solid var(--ln);border-radius:8px;font:inherit}
input[type=color]{width:48px;height:32px;border:1px solid var(--ln);border-radius:8px;padding:2px;background:#fff}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib button,.row button{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px 6px;color:var(--ink)}
.lib button:hover,.row button:hover{border-color:var(--gold);background:#fbf7ef}
.row{display:flex;gap:8px}.row button{flex:1}.row button[disabled]{opacity:.45;cursor:not-allowed}
.stage{position:relative;min-width:0;min-height:0;background:#f7f9fb}
#cv,#v3{position:absolute;inset:0;width:100%;height:100%;display:block}#cv{touch-action:none;cursor:default}#v3 canvas{width:100%;height:100%;display:block}
#msg{position:absolute;left:12px;bottom:10px;margin:0;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:6px 12px;color:var(--mute);font-size:.85rem;max-width:calc(100% - 24px)}
.hint{color:var(--mute);font-size:.82rem}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:62vh auto}aside{order:2;border-right:0;border-top:1px solid var(--ln)}.stage{order:1}}
</style></head>
<body>
<header class="bar"><a class="brand" href="index.html">SNK <b>ARCHITECT</b> · Plan Studio</a>
<div class="tg" role="group" aria-label="View"><button id="b2" aria-pressed="true">2D</button><button id="b3" aria-pressed="false">3D</button></div>
<div class="tg" role="group" aria-label="Unit"><button id="um" aria-pressed="true">m</button><button id="uf" aria-pressed="false">ft</button></div>
<button class="btn" id="exp">Export image</button></header>
<div class="app"><aside>
<h2>Room size</h2><label>Width <input id="rw" type="number" step="0.1"></label><label>Length <input id="rl" type="number" step="0.1"></label>
<h2>Add object</h2><div class="lib" id="lib"></div>
<h2>Selected</h2><p id="sn" class="hint">Click an object in the plan. Drag to move.</p>
<div class="row"><button id="rot">Rotate 90°</button><button id="del">Delete</button></div>
<label style="margin-top:8px">Colour <input id="col" type="color"></label>
<h2>Plan</h2><div class="row"><button id="clr">Clear all</button><button id="rst">Example room</button></div>
<p class="hint" style="margin-top:12px">Simplified single-room planner. Doors and windows snap to walls. Saved automatically in this browser. Concept only, not construction drawings.</p>
</aside><main class="stage" id="stage"><canvas id="cv" aria-label="2D floor plan"></canvas><div id="v3" hidden></div><p id="msg" role="status">2D plan</p></main></div>
<script type="module">
const $=i=>document.getElementById(i);
const T={sofa:['Sofa',2,.9,.85,'#1f7a8c'],armchair:['Armchair',.85,.85,.85,'#2a6f97'],coffee:['Coffee table',1,.6,.4,'#a6a69d'],dining:['Dining table',1.6,.9,.75,'#8b6b4a'],
 bed:['Bed',1.6,2,.55,'#6c7fa6'],wardrobe:['Wardrobe',1.2,.6,2,'#8b6b4a'],tv:['TV unit',1.5,.4,.5,'#5c3d22'],plant:['Plant',.5,.5,1,'#3f8a47'],rug:['Rug',2.4,1.6,.02,'#c9a77c'],
 door:['Door',.9,.12,2.1,'#7a4b25'],window:['Window',1.2,.12,1.2,'#7fb8e0']};
const WALL=['door','window'],id=()=>Math.random().toString(36).slice(2,8);
const example=()=>({w:5,l:4,u:'m',o:[{id:id(),t:'rug',x:2.5,y:2.4,r:0},{id:id(),t:'sofa',x:2.5,y:1.0,r:0},{id:id(),t:'coffee',x:2.5,y:2.5,r:0},{id:id(),t:'armchair',x:1.0,y:3.0,r:0},{id:id(),t:'plant',x:4.5,y:3.5,r:0},{id:id(),t:'door',x:1.2,y:0,r:0,wl:0},{id:id(),t:'window',x:5,y:2,r:90,wl:1}]});
let S;try{S=JSON.parse(localStorage.getItem('snk-plan')||'null')}catch(e){}
if(!S||!S.o)S=example();
let sel=null,mode=2,drag=null;
const save=()=>{try{localStorage.setItem('snk-plan',JSON.stringify(S))}catch(e){}};
const msg=t=>$('msg').textContent=t;
const fmt=v=>S.u==='m'?v.toFixed(2)+' m':(v*3.28084).toFixed(2)+' ft';
const dims=o=>{const t=T[o.t],sw=o.r%180===90;return sw?[t[2],t[1]]:[t[1],t[2]]};
// ---- UI: library, size, unit
Object.entries(T).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v[0];b.onclick=()=>{add(k)};$('lib').appendChild(b)});
function add(k){const o={id:id(),t:k,x:S.w/2,y:S.l/2,r:0};if(WALL.includes(k)){o.x=S.w/2;o.y=0;o.wl=0}S.o.push(o);sel=o.id;save();sync();draw()}
const toU=v=>S.u==='m'?v:v*3.28084,fromU=v=>S.u==='m'?v:v/3.28084;
function fields(){$('rw').value=toU(S.w).toFixed(2);$('rl').value=toU(S.l).toFixed(2)}
function room(){const w=fromU(+$('rw').value),l=fromU(+$('rl').value);if(w>=2&&w<=30&&l>=2&&l<=30){S.w=w;S.l=l;S.o.forEach(o=>place(o,o.x,o.y));save();draw();if(mode===3)build3()}else msg('Room size must be 2–30 m')}
$('rw').onchange=$('rl').onchange=room;
function unit(u){S.u=u;$('um').setAttribute('aria-pressed',u==='m');$('uf').setAttribute('aria-pressed',u==='ft');fields();save();draw()}
$('um').onclick=()=>unit('m');$('uf').onclick=()=>unit('ft');
function sync(){const o=S.o.find(a=>a.id===sel);$('sn').textContent=o?T[o.t][0]+(WALL.includes(o.t)?' (snaps to walls)':''):'Click an object in the plan. Drag to move.';
 $('rot').disabled=!o||WALL.includes(o.t);$('del').disabled=!o;$('col').disabled=!o;$('col').value=o?(o.c||T[o.t][4]):'#cccccc'}
$('rot').onclick=()=>{const o=S.o.find(a=>a.id===sel);if(o&&!WALL.includes(o.t)){o.r=(o.r+90)%360;place(o,o.x,o.y);save();draw()}};
$('del').onclick=()=>{S.o=S.o.filter(a=>a.id!==sel);sel=null;save();sync();draw()};
$('col').oninput=e=>{const o=S.o.find(a=>a.id===sel);if(o){o.c=e.target.value;save();draw()}};
$('clr').onclick=()=>{if(confirm('Remove all objects?')){S.o=[];sel=null;save();sync();draw()}};
$('rst').onclick=()=>{if(confirm('Replace the plan with the example room?')){S=example();sel=null;fields();unit('m');save();sync();draw()}};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Delete'||e.key==='Backspace')$('del').click();if(e.key==='r'||e.key==='R')$('rot').click()});
// ---- placement rules
function place(o,x,y){
  if(WALL.includes(o.t)){const hw=T[o.t][1]/2,d=[y,S.w-x,x,S.l-y],wl=d.indexOf(Math.min(...d));o.wl=wl;
    if(wl===0){o.y=0;o.x=Math.max(hw,Math.min(S.w-hw,x));o.r=0}else if(wl===2){o.y=S.l;o.x=Math.max(hw,Math.min(S.w-hw,x));o.r=0}
    else if(wl===3){o.x=0;o.y=Math.max(hw,Math.min(S.l-hw,y));o.r=90}else{o.x=S.w;o.y=Math.max(hw,Math.min(S.l-hw,y));o.r=90}}
  else{const[w,d]=dims(o);o.x=Math.max(w/2,Math.min(S.w-w/2,x));o.y=Math.max(d/2,Math.min(S.l-d/2,y))}}
// ---- 2D drawing
const cv=$('cv'),cx=cv.getContext('2d');let sc=1,ox=0,oy=0,dpr=1;
function resize(){const st=$('stage');dpr=Math.min(devicePixelRatio||1,2);cv.width=st.clientWidth*dpr;cv.height=st.clientHeight*dpr;draw()}
new ResizeObserver(resize).observe($('stage'));
function draw(){
  if(mode!==2)return;const W=cv.width,H=cv.height,m=76*dpr;sc=Math.max(1,Math.min((W-2*m)/S.w,(H-2*m)/S.l));ox=(W-S.w*sc)/2;oy=(H-S.l*sc)/2;
  cx.clearRect(0,0,W,H);cx.fillStyle='#f7f9fb';cx.fillRect(0,0,W,H);
  cx.lineWidth=1;for(let v=0;;v++){const g=ox%(sc*.5)+v*sc*.5;if(g>W)break;cx.strokeStyle=Math.round((g-ox)/(sc*.5))%2?'#eceff2':'#e1e6ea';cx.beginPath();cx.moveTo(g,0);cx.lineTo(g,H);cx.stroke()}
  for(let v=0;;v++){const g=oy%(sc*.5)+v*sc*.5;if(g>H)break;cx.strokeStyle=Math.round((g-oy)/(sc*.5))%2?'#eceff2':'#e1e6ea';cx.beginPath();cx.moveTo(0,g);cx.lineTo(W,g);cx.stroke()}
  cx.fillStyle='#ffe3cf';cx.fillRect(ox,oy,S.w*sc,S.l*sc);
  S.o.filter(o=>!WALL.includes(o.t)).sort((a,b)=>T[a.t][3]-T[b.t][3]).forEach(o=>obj(o));
  const wt=Math.max(.12*sc,5*dpr);cx.lineWidth=wt;cx.strokeStyle='#111';cx.lineJoin='miter';cx.strokeRect(ox,oy,S.w*sc,S.l*sc);
  S.o.filter(o=>WALL.includes(o.t)).forEach(o=>opening(o,wt));
  dimLine(ox,oy-40*dpr,ox+S.w*sc,oy-40*dpr,fmt(S.w),0);dimLine(ox-40*dpr,oy,ox-40*dpr,oy+S.l*sc,fmt(S.l),1);
}
function obj(o){const[w,d]=[T[o.t][1]*sc,T[o.t][2]*sc],X=ox+o.x*sc,Y=oy+o.y*sc;
  cx.save();cx.translate(X,Y);cx.rotate(o.r*Math.PI/180);cx.fillStyle=o.c||T[o.t][4];cx.strokeStyle='#26323d';cx.lineWidth=1.5*dpr;cx.fillRect(-w/2,-d/2,w,d);cx.strokeRect(-w/2,-d/2,w,d);
  if(o.id===sel){cx.strokeStyle='#D7B77B';cx.lineWidth=3*dpr;cx.setLineDash([8*dpr,5*dpr]);cx.strokeRect(-w/2-4*dpr,-d/2-4*dpr,w+8*dpr,d+8*dpr)}cx.restore();
  if(Math.min(w,d)>26*dpr&&o.t!=='rug'){cx.fillStyle='#fff';cx.font=(11*dpr)+'px system-ui';cx.textAlign='center';cx.fillText(T[o.t][0],X,Y+4*dpr)}}
function opening(o,wt){const L=T[o.t][1]*sc,X=ox+o.x*sc,Y=oy+o.y*sc,h=o.r===0,t=wt+3*dpr;
  cx.save();cx.fillStyle='#f7f9fb';if(h)cx.fillRect(X-L/2,Y-t/2,L,t);else cx.fillRect(X-t/2,Y-L/2,t,L);
  cx.lineWidth=2*dpr;cx.strokeStyle=o.t==='window'?'#2d8fd5':'#111';
  if(o.t==='window'){cx.beginPath();if(h){cx.moveTo(X-L/2,Y-wt/4);cx.lineTo(X+L/2,Y-wt/4);cx.moveTo(X-L/2,Y+wt/4);cx.lineTo(X+L/2,Y+wt/4)}else{cx.moveTo(X-wt/4,Y-L/2);cx.lineTo(X-wt/4,Y+L/2);cx.moveTo(X+wt/4,Y-L/2);cx.lineTo(X+wt/4,Y+L/2)}cx.stroke()}
  else{cx.lineWidth=1.5*dpr;cx.beginPath();const wl=o.wl;
    if(wl===0){const hx=X-L/2;cx.moveTo(hx,Y);cx.lineTo(hx,Y+L);cx.moveTo(X+L/2,Y);cx.arc(hx,Y,L,0,Math.PI/2)}
    else if(wl===2){const hx=X-L/2;cx.moveTo(hx,Y);cx.lineTo(hx,Y-L);cx.moveTo(X+L/2,Y);cx.arc(hx,Y,L,-Math.PI/2,0,false)}
    else if(wl===3){const hy=Y-L/2;cx.moveTo(X,hy);cx.lineTo(X+L,hy);cx.moveTo(X+L,hy);cx.arc(X,hy,L,0,Math.PI/2)}
    else{const hy=Y-L/2;cx.moveTo(X,hy);cx.lineTo(X-L,hy);cx.moveTo(X-L,hy);cx.arc(X,hy,L,Math.PI,Math.PI/2,true)}cx.stroke()}
  if(o.id===sel){cx.strokeStyle='#D7B77B';cx.lineWidth=3*dpr;cx.setLineDash([6*dpr,4*dpr]);cx.strokeRect(h?X-L/2-4*dpr:X-t/2-4*dpr,h?Y-t/2-4*dpr:Y-L/2-4*dpr,h?L+8*dpr:t+8*dpr,h?t+8*dpr:L+8*dpr)}cx.restore()}
function dimLine(x1,y1,x2,y2,txt,vert){cx.save();cx.strokeStyle=cx.fillStyle='#4b5966';cx.lineWidth=1*dpr;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);
  const k=6*dpr;if(vert){cx.moveTo(x1-k,y1);cx.lineTo(x1+k,y1);cx.moveTo(x2-k,y2);cx.lineTo(x2+k,y2)}else{cx.moveTo(x1,y1-k);cx.lineTo(x1,y1+k);cx.moveTo(x2,y2-k);cx.lineTo(x2,y2+k)}cx.stroke();
  cx.font='600 '+(13*dpr)+'px system-ui';cx.textAlign='center';const mx=(x1+x2)/2,my=(y1+y2)/2,tw=cx.measureText(txt).width+12*dpr;
  cx.translate(mx,my);if(vert)cx.rotate(-Math.PI/2);cx.fillStyle='#f7f9fb';cx.fillRect(-tw/2,-9*dpr,tw,18*dpr);cx.fillStyle='#26323d';cx.fillText(txt,0,5*dpr);cx.restore()}
// ---- pointer interaction (2D)
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
function hit(px,py){for(let i=S.o.length-1;i>=0;i--){const o=S.o[i],t=T[o.t],X=ox+o.x*sc,Y=oy+o.y*sc,a=-o.r*Math.PI/180,dx=px-X,dy=py-Y,
  lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a),hw=Math.max(t[1]*sc/2,12*dpr),hd=Math.max(t[2]*sc/2,12*dpr);if(Math.abs(lx)<=hw&&Math.abs(ly)<=hd)return o}return null}
cv.onpointerdown=e=>{const[px,py]=pos(e),o=hit(px,py);sel=o?o.id:null;if(o){drag={o,dx:(px-ox)/sc-o.x,dy:(py-oy)/sc-o.y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'}sync();draw()};
cv.onpointermove=e=>{const[px,py]=pos(e);if(!drag){cv.style.cursor=hit(px,py)?'grab':'default';return}
  place(drag.o,(px-ox)/sc-drag.dx,(py-oy)/sc-drag.dy);draw()};
cv.onpointerup=()=>{if(drag){save()}drag=null;cv.style.cursor='default'};
// ---- 3D (loaded only when needed)
let TH=null,R,SC,CAM,CT,G=null;
async function init3(){const THREE=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js');TH=THREE;
  R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));$('v3').appendChild(R.domElement);
  SC=new THREE.Scene();SC.background=new THREE.Color(0xf1f4f7);CAM=new THREE.PerspectiveCamera(45,1,.1,100);
  SC.add(new THREE.HemisphereLight(0xffffff,0x888888,1.3));const d=new THREE.DirectionalLight(0xffffff,1.6);d.position.set(5,10,6);SC.add(d);
  CT=new OrbitControls(CAM,R.domElement);CT.enableDamping=true;CT.maxPolarAngle=Math.PI*.49;
  new ResizeObserver(()=>{const s=$('stage');R.setSize(s.clientWidth,s.clientHeight,false);CAM.aspect=s.clientWidth/s.clientHeight;CAM.updateProjectionMatrix()}).observe($('stage'));
  R.setAnimationLoop(()=>{if(mode===3){CT.update();R.render(SC,CAM)}})}
function build3(){const THREE=TH;if(G){SC.remove(G);G.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
  G=new THREE.Group();SC.add(G);const bx=(w,h,d,c,x,y,z,op,ry)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8,transparent:!!op,opacity:op||1,depthWrite:!op}));m.position.set(x,y,z);if(ry)m.rotation.y=ry;G.add(m)};
  const cxm=S.w/2,czm=S.l/2,H=2.6,t=.12;bx(S.w,.06,S.l,0xffe3cf,0,-.03,0);
  bx(S.w+t,H,t,0xffffff,0,H/2,-czm,.28);bx(S.w+t,H,t,0xffffff,0,H/2,czm,.28);bx(t,H,S.l,0xffffff,-cxm,H/2,0,.28);bx(t,H,S.l,0xffffff,cxm,H/2,0,.28);
  S.o.forEach(o=>{const q=T[o.t],x=o.x-cxm,z=o.y-czm,c=o.c||q[4];
    if(o.t==='window')bx(q[1],q[3],.16,c,x,1.5,z,.55,-o.r*Math.PI/180);else if(o.t==='door')bx(q[1],q[3],.16,c,x,q[3]/2,z,0,-o.r*Math.PI/180);else bx(q[1],q[3],q[2],c,x,q[3]/2,z,0,-o.r*Math.PI/180)});
  const m=Math.max(S.w,S.l);CAM.position.set(m*.9,m*.95,m*1.15);CT.target.set(0,.6,0);CT.update()}
async function setMode(m){
  if(m===3){try{msg('Loading 3D…');if(!TH)await init3();build3()}catch(e){console.error(e);msg('3D view needs an internet connection and WebGL ('+(e.message||e)+').');return}}
  mode=m;$('b2').setAttribute('aria-pressed',m===2);$('b3').setAttribute('aria-pressed',m===3);cv.hidden=m!==2;$('v3').hidden=m!==3;
  msg(m===2?'2D plan · drag objects · R rotates · Delete removes':'3D view · drag to orbit, scroll to zoom (simplified model)');if(m===2)resize();else dispatchEvent(new Event('resize'))}
$('b2').onclick=()=>setMode(2);$('b3').onclick=()=>setMode(3);
$('exp').onclick=()=>{const c=mode===2?cv:R.domElement;if(mode===3)R.render(SC,CAM);c.toBlob(b=>{if(!b){msg('Export is not supported here');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snk-plan-'+(mode===2?'2d':'3d')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)})};
fields();unit(S.u||'m');sync();resize();
</script></body></html>
