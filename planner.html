    else if(fc===2)fw=[{x:0,w:7,h:2.2}];
    else if(fc===3)fw=[-3.6,-1.8,0,1.8,3.6].map(x=>({x,w:.8,h:1.8}));

      if(fc===4&&f>0)[-4.5,-1.5,1.5,4.5].forEach(x=>B(.3,H,.5,pal[1],x,f*H+H/2,s*(D/2+.2)))});

function build(){

  $('info').textContent=`জমি: ${Math.round(L*W*u[0])} ${u[1]} · প্রতি তলা: ${Math.round(bw*bd*u[0])} ${u[1]} · মোট (${F} তলা): ${Math.round(bw*bd*F*u[0])} ${u[1]}`;
  {const a=bw*bd*F*10.7639,r=+$('r'+$('q').value).value||0,t=a*r,f=n=>n>=1e7?(n/1e7).toFixed(2)+' কোটি':n>=1e5?(n/1e5).toFixed(1)+' লাখ':Math.round(n);
   dim.cost=t;dim.fmt=f;$('cost').textContent=r?`আনুমানিক খরচ: ৳ ${f(t)} (সম্ভাব্য সীমা ৳ ${f(t*.85)} – ${f(t*1.15)}) · মোট ${Math.round(a)} ফুট² × ৳${r}`:''}
}
function frame(top){

}
const ext=()=>mode==='out'||mode==='t4'||mode==='c5'||mode==='fin';
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),0);renderer.localClippingEnabled=true;
let prog=1,auto=false,t0=0,lastLive='';
function resetLook(){scene.background=new THREE.Color(0xe9eee8);amb.intensity=.8;sun.intensity=.8;sun.color.setHex(0xffffff)}
const KF=[[0,0xcfe3f2,.85,.8],[.35,0xcfe3f2,.85,.8],[.5,0x4a3345,.5,.45],[.65,0x080b16,.2,.1],[.85,0x080b16,.2,.1],[1,0xcfe3f2,.85,.8]];

    const Ht=dim.F*3+3.2;clip.constant=Math.max(0,(prog-.12)/.88)*Ht;
    const Mo=2+dim.F*2,mo=Math.max(1,Math.ceil(prog*Mo)),ph=prog<.12?'ভিত ও মাটির কাজ':prog<.75?'কাঠামো ও দেয়াল':prog<.9?'ছাদ':'ফিনিশিং';
    s=`মাস ${mo} / ${Mo} · কাজ: ${ph} (উদাহরণ সময়সূচি)`;
    if(mode==='c5'&&dim.cost)s+=` · খরচ এখন: ৳ ${dim.fmt(dim.cost*prog)} / ৳ ${dim.fmt(dim.cost)}`;
  }else if(mode==='fin'){
    const p=(now%24)/24;let i=0;while(i<KF.length-2&&p>KF[i+1][0])i++;
    const a=KF[i],b=KF[i+1],f=(p-a[0])/(b[0]-a[0]);
    scene.background=new THREE.Color(a[1]).lerp(new THREE.Color(b[1]),f);amb.intensity=a[2]+(b[2]-a[2])*f;sun.intensity=a[3]+(b[3]-a[3])*f;
    s='ফাইনাল লাইভ ভিউ: ধীরে ঘুরছে, দিন থেকে রাত';
  }
  if(s!==lastLive){lastLive=s;$('live').textContent=s}
}
$('pg').oninput=()=>{auto=false;prog=$('pg').value/100};
function setMode(m){
  mode=m;document.querySelectorAll('button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('fw').style.display=(m==='in'||m==='plan')?'block':'none';$('pw').style.display=(m==='t4'||m==='c5')?'block':'none';resetLook();if(m==='t4'||m==='c5'){prog=0;auto=true;t0=performance.now()/1000}controls.autoRotate=m==='fin';controls.autoRotateSpeed=2;
  if(m==='plan')$('cut').value=1;
  build();frame(m==='plan');
}
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
['len','wid','unit','q','r0','r1','r2'].forEach(i=>$(i).oninput=build);
$('fl').onchange=()=>{$('cut').max=$('fl').value;$('cut').value=$('fl').value;build();frame(mode==='plan')};
$('cut').oninput=()=>{$('cl').textContent='তলা দেখুন: '+$('cut').value+' তলা পর্যন্ত';build()};
function resize(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const setS=i=>{styleIdx=(i+TOTAL)%TOTAL;$('sn').value=styleIdx+1;build()};
$('sp').onclick=()=>setS(styleIdx-1);$('sx').onclick=()=>setS(styleIdx+1);$('sr').onclick=()=>setS(Math.floor(Math.random()*TOTAL));
$('sn').onchange=()=>{const v=parseInt($('sn').value);if(v>=1&&v<=TOTAL)setS(v-1)};
build();frame(false);
(function loop(){requestAnimationFrame(loop);tick();controls.update();renderer.render(scene,camera)})();
</script>
